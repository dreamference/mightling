# ling-docs: the local file index (specs/DREAMFERENCE_MIGHTLING_LOCAL_INDEX.md). A program of its own
# beside ling, ling-admin and ling-code, outside the Codex workspace: it has its own lockfile, builds
# with `cargo build --release --locked` here, and changing it never rebuilds Codex.
#
# Two native libraries are loaded at run time, never linked or downloaded by the build: PDFium
# (`libpdfium.so`, pdfium-binaries) and ONNX Runtime (`libonnxruntime.so`). Where they are is
# `config::lib_dir()`; `ling-admin docs setup` installs them with the embedding model.
[package]
name = "ling-docs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ling_docs"
path = "src/lib.rs"

[[bin]]
name = "ling-docs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Spreadsheets: `.xlsx`, `.xlsm`, `.xls`, `.xlsb` and `.ods` (Phase 3, §7.1), pure Rust; its own `zip`
# and `quick-xml` are the ones the documents use. MIT.
calamine = { version = "=0.37.0", default-features = false }
# CSV and TSV files (Phase 2, §7.1). MIT OR Unlicense.
csv = "=1.4.0"
# Legacy charsets of HTML pages (`<meta charset>`), as ling-fetch decodes them. (Apache-2.0 OR MIT) AND BSD-3-Clause.
encoding_rs = "=0.8.42"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
# The air-gap reader every component uses (specs/DREAMFERENCE_MIGHTLING_AIRGAPPED.md §6.5).
ling-airgapped = { path = "../ling-rs/airgapped" }
# E-mail (`.eml`, `.mbox`): headers, the text body, attachments (Phase 2, §7.1). Apache-2.0 OR MIT.
mail-parser = { version = "=0.11.9", default-features = false, features = ["full_encoding"] }
# Images for OCR (`.png .jpg .tif .webp .bmp .gif`), pure-Rust decoders only, decoded in the OCR
# sandbox under limits (spec §20). MIT OR Apache-2.0.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
# ONNX Runtime, loaded with dlopen from the lib directory: no build-time download, no network.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22"] }
# PDFium bound at run time to the pdfium-binaries build (§7.1); no image support needed.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# The XML inside Office and OpenDocument files, read as a stream (Phase 2, §7.1). MIT.
quick-xml = "=0.42.0"
rusqlite = { version = "0.37", features = ["bundled"] }
# HTML through html5ever, the parser ling-fetch reads pages with (Phase 2, §7.1). ISC (html5ever
# MIT OR Apache-2.0; selectors and cssparser MPL-2.0).
scraper = { version = "=0.27.0", default-features = false }
# The tree scraper parses into, walked without recursion as ling-fetch does. ISC.
ego-tree = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# XLM-R's SentencePiece vocabulary from the model's own tokenizer.json; pure-Rust regex, no hub.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
toml = "0.8"
unicode-bidi = "0.3"
unicode-normalization = "0.1"
# DOCX and ODT are ZIP archives; only stored and deflated entries are read (Phase 2, §7.1). MIT;
# inflating through zlib-rs (Zlib), the writer the tests build archives with through zopfli (Apache-2.0).
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "debuginfo"
