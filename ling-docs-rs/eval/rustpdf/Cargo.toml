[package]
name = "rustpdf"
version = "0.1.0"
edition = "2021"

[dependencies]
pdf-extract = "0.12"
pdf_oxide = "0.3"
serde_json = "1"
# pdf_oxide 0.3.78 does not compile against office_oxide 0.1.13 (a new struct field); pin the one it was built with.
office_oxide = { version = "=0.1.9", default-features = false }

[profile.release]
debug = false
