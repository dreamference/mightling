# Codex tests that `puffin-admin codex test` does not run, each with the reason.
#
# Everything not listed here is expected to pass on Puffin's tree: the pinned `codex/` submodule
# with `codex-patches/` applied and the launcher compiled in, built and tested by CodexTestRunner.
#
#

[[package]]
name = "codex-voice-host"
reason = "Realtime voice's helper binary. Puffin hides /voice (patch 0010) and does not ship it, and it links GStreamer 1.28, which is not installed."

[[target]]
package = "codex-code-mode-host"
test = "stdio"
reason = "Does not compile at rust-v0.158.0: it builds a ToolDefinition without input_schema_max_bytes, a field the same release added. Upstream's defect; the crate's other test targets run."

