# The Mightling launcher: what used to be Dreamference's Python `ling` entry point, compiled into the
# branded Codex binary. It is not part of the codex submodule. CodexBrandedBuilder copies this crate
# into the exported tree as `codex-rs/ling`; patch 0002 adds one dependency line to the CLI's
# manifest (a path dependency inside the workspace root makes it a member automatically) and one
# call in `cli_main`. It builds against the workspace's own dependency versions.
[package]
name = "ling-launcher"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"

[lib]
name = "ling_launcher"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
# Release signatures: SHA256SUMS.sig is checked before `ling update` installs anything
# (src/release_signature.rs).
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
codex-extension-api = { workspace = true }
codex-models-manager = { workspace = true }
codex-utils-home-dir = { workspace = true }
ed25519-dalek = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# Pure-Rust mDNS browsing, one code path on Linux, macOS and Windows; no async runtime, no logging.
mdns-sd = { version = "0.21.4", default-features = false }
ling-airgapped = { path = "airgapped" }
# Mightling's apps for `/apps` (patch 0022) and as MCP tools (src/apps.rs).
ling-apps = { path = "apps" }
# Observation masking: the rule Codex's core calls (patch 0021); the launcher sets its policy.
ling-masking = { path = "masking" }
ling-node-locator = { path = "node-locator" }
# Skills from other agents: the on-disk half, testable without the Codex workspace (src/skills.rs).
ling-skills = { path = "skills" }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
semver = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }

# Build OpenSSL from source on glibc Linux, as upstream does only for musl, so building ling needs
# no libssl-dev. Cargo unifies features across the build, so enabling `vendored` here applies to the
# openssl-sys every other crate links -- which is what keeps this out of a patch to codex-core.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# `/node` ignores Ctrl-C while its child has the terminal (src/node_command.rs).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# `ling web`: the web server, a crate of its own so its tests run without the Codex workspace
# (src/web.rs). Unix only: it reaches the app-server over a Unix socket; Windows has no `ling web` yet.
ling-web-server = { path = "web" }
# `ling chat`: the messenger bridge, a client of `ling web` (src/chat.rs). Unix only, for the same reason.
ling-chat = { path = "chat" }

# `ling signal`: Mightling over Signal (src/signal.rs). The same crate also builds the small
# `ling-signal` binary the bridge's system account runs from /usr/local/lib/mightling; the launcher
# routes the user's commands to it. Linux only: the bridge is a system unit.
[target.'cfg(target_os = "linux")'.dependencies]
ling-signal = { path = "signal" }

# Windows: whether the process that wrote an air-gap seal is still running (src/airgapped.rs), the
# same windows-sys release the Codex workspace already builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }
# Whether the elevated sandbox is set up, asked exactly as Codex asks it (src/airgapped.rs).
codex-windows-sandbox = { workspace = true }
# `ling audit egress`: the ETW real-time trace (src/audit.rs; WINDOWS_ARM §14).
ferrisetw = "1.2"

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
# Codex's own hook types, to check the trust hashes the launcher computes (refine.rs's tests).
codex-config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tar = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
zip = { workspace = true }
