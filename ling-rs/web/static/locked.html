<h1>Sign in to Mightling</h1>
<p>On the Mightling machine itself, run <code>ling web open</code>: it opens this page signed in.</p>
<p>On another device, run <code>ling web pair</code> on the Mightling machine, then <a href="/pair">pair this device</a> with the code it shows.</p>
</main>
