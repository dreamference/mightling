# The air-gap level's resolution, with no dependency beyond the standard library, so the sandbox
# helper (patch 0019), the launcher and the web commands all decide it the same way. The web crate
# carries a byte-identical copy of src/lib.rs (ling-web-rs/src/airgapped.rs; a test compares
# them), because it is built on its own, outside the Codex workspace.
[package]
name = "ling-airgapped"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ling_airgapped"
path = "src/lib.rs"
