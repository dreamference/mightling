# The Windows client (specs/DREAMFERENCE_PUFFIN_WINDOWS_ARM.md, Phase 1): puffin.exe and its
# commands for Windows on Arm (the RTX Spark laptops) and x86-64 Windows, built and tested on
# GitHub's hosted runners, then installed with install.ps1 under Windows PowerShell 5.1.
#
# Runs on pushes to `windows/**` branches while the port is worked on, by hand, and from the
# Release workflow (`build_windows`), which then publishes what this uploads. Windows builds are a
# preview and are not signed (decided 2026-10-07).
name: Windows

on:
  push:
    branches: ["windows/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version compiled into puffin (empty: a source build)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The small crates and the two standalone ones: minutes, so their failures show long before the
  # Codex build finishes.
  tools:
    name: Tools - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The std-only crates, each in a copy outside the launcher workspace (they inherit nothing
      # from it), tested natively: the air-gap resolver, the node locator, the skills crate with
      # its directory junctions.
      - name: Test the launcher's standalone crates
        shell: bash
        run: |
          set -euo pipefail
          for crate in airgapped node-locator skills; do
            rm -rf "$RUNNER_TEMP/$crate"
            cp -r "puffin-rs/$crate" "$RUNNER_TEMP/$crate"
            (cd "$RUNNER_TEMP/$crate" && cargo test --release)
          done
      - name: Test the web commands
        working-directory: puffin-web-rs
        run: cargo test --release --locked
      - name: Test the code index's queries
        working-directory: puffin-code-rs
        run: cargo test --release --locked --lib

  puffin:
    name: puffin - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Upstream's own Windows release builds "can exceed an hour" on larger machines.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # Compiled into the launcher, so `puffin update` can tell whether a newer release exists.
      PUFFIN_VERSION: ${{ inputs.version }}
    steps:
      - name: Long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Codex submodule
        run: git submodule update --init --depth 1 codex
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The builder imports only these; the package's own dependencies (PyTorch among them) are
      # for the node and have no Windows on Arm wheels.
      - name: Install the builder
        run: |
          pip install --no-deps -e .
          pip install requests rich
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Upstream's own action, from the pinned submodule: the MSVC environment and LLVM's linker
      # for this target.
      - name: MSVC environment
        uses: ./codex/.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Build puffin
        shell: bash
        run: python -c "import sys; from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; sys.exit(0 if B.build(force=True) else 1)"
      # The same export, V8 and target directory the build used, so the tests reuse its crates.
      - name: Launcher test environment
        run: |
          python -c "import os; from dreamference.runner.codex_branded_builder import BUILD_CACHE_DIR as C, CodexBrandedBuilder as B; src = os.path.join(C, 'src'); env = dict(B.fetch_rusty_v8(src), PUFFIN_EXPORT=os.path.join(src, 'codex-rs'), CARGO_TARGET_DIR=os.path.join(C, 'target'), CARGO_PROFILE_RELEASE_DEBUG='none', CARGO_PROFILE_RELEASE_STRIP='debuginfo'); open(os.environ['GITHUB_ENV'], 'a').write(''.join(f'{k}={v}\n' for k, v in env.items()))"
      - name: Launcher tests
        shell: pwsh
        run: |
          Set-Location $env:PUFFIN_EXPORT
          cargo test --release -p puffin-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="$(dirname "$(python -c 'from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; print(B.executable_path())')")"
          ls -l "$bin"
          "$bin/puffin.exe" --version
          "$bin/puffin.exe" --help > /dev/null
          "$bin/puffin-search.exe" --help > /dev/null
          "$bin/puffin-code.exe" --help > /dev/null
      - name: Package
        run: python .github/scripts/package_puffin.py dist
      # install.ps1 end to end, under Windows PowerShell 5.1 (what a standard Windows 11 laptop
      # has), against a stand-in for GitHub's release API serving the assets just packaged.
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $server = Start-Process -PassThru -NoNewWindow python -ArgumentList ".github\scripts\fake_release.py", "dist", "8787", "dreamference/puffin-ai", "v0.0.0-ci"
          Start-Sleep -Seconds 3
          $env:PUFFIN_RELEASE_API = "http://127.0.0.1:8787"
          $env:PUFFIN_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "puffin-install\bin"
          try {
            Write-Host "PowerShell $($PSVersionTable.PSVersion)"
            & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
            & (Join-Path $env:PUFFIN_INSTALL_DIR "puffin.exe") --version
            if ($LASTEXITCODE -ne 0) { throw "the installed puffin.exe did not run" }
            # Again, over the installed files: the replace-aside path.
            & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE -ne 0) { throw "a second install.ps1 failed" }
            Get-ChildItem $env:PUFFIN_INSTALL_DIR | Format-Table Name, Length
            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if (-not (($userPath -split ";") -contains $env:PUFFIN_INSTALL_DIR)) { throw "the install folder is not on the user's PATH" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: puffin-windows-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
