name: Product site

# Builds the MkDocs site on every change to it, strictly (a broken link or a missing page fails the
# build), and deploys it to GitHub Pages only when Pages is enabled for the repository. Enabling
# Pages is a deliberate step taken in the repository settings (Pages → Source: GitHub Actions):
# this workflow never enables it by itself, because on a private repository that would publish the
# site.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Pinned: MkDocs 2.0 drops the plugin and theme system Material depends on.
      - name: Install MkDocs
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"

      - name: Build (strict)
        run: mkdocs build --strict

      # One Pages site per repository: the one-page website (website/, static) at the root and the
      # MkDocs documentation under /docs/. website/CNAME carries the custom domain.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp -r site _site/docs

      - name: Is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages enabled with the default "Deploy from a branch" source answers here too, but then
          # the Actions deploy fails -- only the GitHub Actions source ("workflow") counts.
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Site built and checked but not deployed: enable GitHub Pages with Source: GitHub Actions to publish it."
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4