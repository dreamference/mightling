# Cuts a product release on demand: Actions tab → "Release" → Run workflow.
#
# Builds the Python distribution (the `ling-admin` command), the prebuilt `ling` agent that
# `ling update` downloads, and, optionally, the Mightling desktop bundle, then publishes them as a
# GitHub release tagged v<version> on the commit the workflow was dispatched from. The version is
# stamped into setup.py, the desktop app's package and the ling binary inside the runner's checkout
# only -- nothing is committed back, so the tag is the record of the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.3.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (publish it by hand afterwards)"
        type: boolean
        default: true
      run_tests:
        description: "Gate the release on the test suite"
        type: boolean
        default: true
      build_desktop:
        description: "Build the Mightling desktop app (.deb; needs the ling build, which it bundles)"
        type: boolean
        default: true
      desktop_runner:
        description: "Runner for the desktop build; GB10 is arm64"
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
      build_mightling:
        description: "Build the Mightling agent binaries that `ling update` installs"
        type: boolean
        default: true
      mightling_runner:
        description: "Runner for the ling build; its architecture names the assets (GB10 is arm64)"
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
      build_windows:
        description: "Also build the Windows client (Arm64 and x86-64; preview, unsigned). Off until its CI passes"
        type: boolean
        default: false
      build_clients:
        description: "Also build the client for Intel/AMD Linux and macOS (build-clients.yml)"
        type: boolean
        default: false
      build_mac_preview:
        description: "Also build the Mac desktop app (.dmg, Apple silicon and Intel; preview, unsigned). Needs build_clients, whose macOS ling it bundles"
        type: boolean
        default: false

# Read-only by default; only the job that publishes the release may write (security review
# 2026-10). Every action is pinned to a commit, with its tag in a comment, so a moved tag cannot
# change what runs with that write token.
permissions:
  contents: read

# One release at a time; a second dispatch waits rather than racing the first for the tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check version format and that the tag is free
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.3.0 or 1.3.0-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

  test:
    needs: validate
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # The pip cache is keyed on a dependency file, and this project declares its
          # dependencies in setup.py, not requirements.txt or pyproject.toml.
          cache-dependency-path: setup.py
      - name: Install
        # `.[dev]` brings the pinned ruff the code-standard ratchet (tests/test_code_quality.py) needs.
        run: pip install -e ".[dev]" pytest
      # No GPU or Docker needed: every hardware and subprocess call in the suite is mocked.
      - name: Test
        run: python -m pytest tests/ -q

  python-dist:
    needs: [validate, test]
    # `test` is skipped when run_tests is off; skipped still counts as clear to proceed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Stamp version
        run: sed -i -E "s/version=\"[^\"]+\"/version=\"$VERSION\"/" setup.py && grep -n 'version=' setup.py
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          # The installer for a machine with no checkout (README, "Install from a release"): it
          # downloads this release's other assets, so it travels with them.
          cp install.sh dist/
          # Its Windows counterpart, for the Windows client's assets when the release carries them.
          cp install.ps1 dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  desktop:
    # The Electron app bundles `ling` and `codex-code-mode-host` (desktop/electron, built the way
    # the Codex desktop app is built), so it waits for the `ling` job and takes its binaries.
    needs: [validate, test, ling]
    if: ${{ inputs.build_desktop && inputs.build_mightling && !failure() && !cancelled() }}
    runs-on: ${{ inputs.desktop_runner }}
    env:
      MIGHTLING_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mightling-binaries
          path: dist
      - name: Bundled binaries
        run: |
          # Named exactly: `ling-*` would also match ling-search, ling-fetch and ling-code.
          target="$(uname -m)-unknown-linux-gnu"
          mkdir -p desktop/electron/resources
          gunzip -c "dist/ling-$target.gz" > desktop/electron/resources/ling
          gunzip -c "dist/codex-code-mode-host-$target.gz" > desktop/electron/resources/codex-code-mode-host
          chmod 755 desktop/electron/resources/ling desktop/electron/resources/codex-code-mode-host
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # Work's UI (desktop/ui), bundled into the app by its Vite build; its tests need no Electron.
      - name: Work window frontend
        working-directory: desktop/ui
        run: |
          npm ci
          npm test
      # The main process's unit tests, the typecheck, then Forge: Vite builds, `package` writes
      # out/Mightling-linux-<arch>/ and flips the fuses, `make` wraps it in the .deb (and a zip).
      - name: Build the app
        working-directory: desktop/electron
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run make
          # Again, now that the bundles exist: no credential string in the preload or Work's page.
          npx vitest run src/credentials.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-bundles
          path: |
            desktop/electron/out/make/deb/*/*.deb
          if-no-files-found: error

  ling:
    needs: [validate, test]
    if: ${{ inputs.build_mightling && !failure() && !cancelled() }}
    runs-on: ${{ inputs.mightling_runner }}
    env:
      # Compiled into the launcher, so `ling update` can tell whether a newer release exists.
      MIGHTLING_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Only the pinned Codex fork; the ling-engine submodule (a spec) plays no part in the build.
      - name: Codex submodule
        run: git submodule update --init --depth 1 codex
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install ling-admin
        run: pip install -e .
      # Only the registry is cached: Codex's target directory runs to many gigabytes, past what the
      # Actions cache holds. rustup fetches the toolchain codex-rs/rust-toolchain.toml pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'codex-patches/**', 'ling-rs/**', 'ling-web-rs/Cargo.lock', 'ling-code-rs/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.arch }}-
      # The same build `ling-admin codex build` runs locally: export the submodule, add
      # ling-rs/, apply codex-patches/, cargo build with prebuilt V8 fetched and verified; then
      # the web commands from ling-web-rs/ and the code index router from ling-code-rs/, each a
      # separate --locked build.
      - name: Build ling
        run: ling-admin codex build --force
      # Their own tests run the two binaries against a local stand-in for SearXNG and for web
      # pages; the build above has installed the toolchain they need.
      - name: Test the web commands
        working-directory: ling-web-rs
        run: ~/.cargo/bin/cargo test --release --locked
      - name: Package
        run: |
          bin="$(dirname "$(python -c 'from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; print(B.executable_path())')")"
          target="$(uname -m)-unknown-linux-gnu"
          mkdir -p dist
          gzip -9 -c "$bin/ling" > "dist/ling-$target.gz"
          gzip -9 -c "$bin/codex-code-mode-host" > "dist/codex-code-mode-host-$target.gz"
          gzip -9 -c "$bin/ling-search" > "dist/ling-search-$target.gz"
          gzip -9 -c "$bin/ling-fetch" > "dist/ling-fetch-$target.gz"
          # The router only: `ling-admin code setup` fetches the indexers it runs.
          gzip -9 -c "$bin/ling-code" > "dist/ling-code-$target.gz"
          # Mightling began as a fork of the Codex CLI (Apache 2.0), whose licence and notice must
          # travel with the binaries (Apache 2.0 section 4); the names say what they belong to.
          cp codex/LICENSE dist/THIRD-PARTY-LICENSE-codex-cli.txt
          cp codex/NOTICE dist/THIRD-PARTY-NOTICE-codex-cli.txt
          # `ling update` checks every archive against this file before installing any.
          (cd dist && sha256sum "ling-$target.gz" "codex-code-mode-host-$target.gz" \
            "ling-search-$target.gz" "ling-fetch-$target.gz" "ling-code-$target.gz" \
            > "ling-$target.sha256sums")
          # The transition from Puffin (specs/DREAMFERENCE_RENAME_MIGHTLING.md §4.1): a 1.4.x
          # `puffin update` asks for these exact names, so the same binaries are published under
          # them too, with a checksum file that lists them. The new binary migrates the old
          # installation the first time it runs. Dropped in a later release, announced in its notes.
          for name in "" -search -fetch -code; do
            cp "dist/ling$name-$target.gz" "dist/puffin$name-$target.gz"
          done
          (cd dist && sha256sum "puffin-$target.gz" "codex-code-mode-host-$target.gz" \
            "puffin-search-$target.gz" "puffin-fetch-$target.gz" "puffin-code-$target.gz" \
            > "puffin-$target.sha256sums")
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mightling-binaries
          path: dist/*
          if-no-files-found: error

  # The Windows client (specs/DREAMFERENCE_MIGHTLING_WINDOWS_ARM.md, Phase 1): the same workflow that
  # runs on pushes to windows/** branches, with this release's version compiled in.
  windows:
    needs: [validate, test]
    if: ${{ inputs.build_windows && !failure() && !cancelled() }}
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ inputs.version }}

  # The client for machines that are not a GB10 (x86-64 Linux, macOS), built by the same workflow
  # CI runs on clients/** branches; its artifacts are named mightling-client-<target>.
  ling-clients:
    needs: [validate, test]
    if: ${{ inputs.build_clients && !failure() && !cancelled() }}
    uses: ./.github/workflows/build-clients.yml
    with:
      version: ${{ inputs.version }}

  # The Mac desktop app, an unsigned preview (signed ad hoc only): the Electron app with the macOS
  # ling of `ling-clients` inside, one dmg per architecture, named Mightling-<version>-<arch>-preview.dmg.
  desktop-mac:
    needs: [validate, test, ling-clients]
    if: ${{ inputs.build_mac_preview && inputs.build_clients && !failure() && !cancelled() }}
    # The called workflow declares actions: read (for another run's artifacts); a caller must grant
    # at least what it asks. Here it reads only this run's.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mac-preview.yml
    with:
      version: ${{ inputs.version }}
      client_run_id: this

  release:
    needs: [python-dist, desktop, ling, windows, ling-clients, desktop-mac]
    permissions:
      contents: write
      # Build provenance: the OIDC token Sigstore certifies, and the right to store the attestation.
      id-token: write
      attestations: write
    # `desktop`, `ling`, `windows` and `ling-clients` are skipped when their inputs are off; the release still
    # goes out without them.
    if: ${{ !failure() && !cancelled() && needs.python-dist.result == 'success' }}
    # The signing key lives only in this environment, which runs from `main` alone and waits for
    # the maintainer's approval: a workflow pushed to any other branch cannot read it.
    environment: release
    runs-on: ubuntu-latest
    steps:
      # Only the trusted keys and a key transition, if one is under way: the signature is checked
      # against what `ling update` and install.sh will check it against before anything is published.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            ling-rs/release-signing.pub
            ling-rs/release-key-transition.pub
            ling-rs/release-key-transition.pub.sig
          sparse-checkout-cone-mode: false
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write and sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # A key rotation ships the new key, signed by the old one, with every release until no
          # older ling is left to need it (specs/DREAMFERENCE_RELEASE_SIGNING.md §5).
          if [[ -f source/ling-rs/release-key-transition.pub ]]; then
            cp source/ling-rs/release-key-transition.pub source/ling-rs/release-key-transition.pub.sig artifacts/
          fi
          # merge-multiple keeps each artifact's own subdirectories (deb/, appimage/), so collect the
          # files themselves; handing gh a directory fails the upload after the release is created.
          mapfile -t files < <(find artifacts -type f | sort)
          # One checksum file for everything the release carries: the wheel, install.sh and the
          # per-target sums files, which in turn list the binaries. Its signature is what
          # `ling update` and install.sh trust, so it covers every file transitively.
          for file in "${files[@]}"; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done > SHA256SUMS
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set; releases from 1.5.0 on must be signed."
            exit 1
          fi
          key="$(mktemp -d)/release-ed25519"
          ( umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key" )
          ssh-keygen -q -Y sign -f "$key" -n mightling-release SHA256SUMS
          rm -f "$key"
          # Check the signature the way the clients will: by a key in release-signing.pub, or by a
          # key the transition names, endorsed by one that is. A secret that matches neither stops
          # the release here instead of publishing one no installed ling would accept.
          trusted="$(mktemp)"
          grep -v '^#' source/ling-rs/release-signing.pub | awk 'NF {print "mightling-release " $1 " " $2}' > "$trusted"
          if [[ -f artifacts/release-key-transition.pub ]]; then
            cp "$trusted" endorsers
            ssh-keygen -Y verify -f endorsers -I mightling-release -n mightling-release-key \
              -s artifacts/release-key-transition.pub.sig < artifacts/release-key-transition.pub
            grep -v '^#' artifacts/release-key-transition.pub | awk 'NF {print "mightling-release " $1 " " $2}' >> "$trusted"
          fi
          ssh-keygen -Y verify -f "$trusted" -I mightling-release -n mightling-release \
            -s SHA256SUMS.sig < SHA256SUMS || {
            echo "::error::SHA256SUMS.sig does not verify against ling-rs/release-signing.pub: RELEASE_SIGNING_KEY is not a release key."
            exit 1
          }
          # Everything attested: each file the release carries, SHA256SUMS and its signature.
          { cat SHA256SUMS; sha256sum SHA256SUMS SHA256SUMS.sig; } > attested.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: attested.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --target "$GITHUB_SHA" --title "Mightling $TAG")
          [[ "${{ inputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          [[ "${{ inputs.draft }}" == "true" ]] && flags+=(--draft)
          # merge-multiple keeps each artifact's own subdirectories (deb/), so collect the
          # files themselves; handing gh a directory fails the upload after the release is created.
          mapfile -t files < <(find artifacts -type f | sort)
          files+=(SHA256SUMS SHA256SUMS.sig)
          # The Mac app is a preview and is not notarized: say so above the generated notes.
          if printf '%s\n' "${files[@]}" | grep -q -- '-preview\.dmg$'; then
            {
              echo "### Mac desktop app (preview, unsigned)"
              echo
              echo "\`Mightling-${VERSION}-arm64-preview.dmg\` (Apple silicon) and \`Mightling-${VERSION}-x64-preview.dmg\` (Intel) are a preview of the desktop app for macOS 12 or later, a client of a Mightling node on your network. They are signed ad hoc only, with no Apple Developer ID and no notarization, so macOS refuses to open the app the first time."
              echo "Drag Mightling to Applications, try to open it once, then allow it in System Settings → Privacy & Security → Open Anyway (on macOS 14 and earlier, Control-click the app and choose Open instead)."
              echo "Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Mightling.app\`. Check the dmg against SHA256SUMS first; steps in docs/desktop.md."
              echo
            } > notes.md
            flags+=(--notes-file notes.md)
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
