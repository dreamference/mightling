# Cuts a product release on demand: Actions tab → "Release" → Run workflow.
#
# Builds the Python distribution (the `puffin-admin` command), the prebuilt `puffin` agent that
# `puffin update` downloads, and, optionally, the Puffin desktop bundle, then publishes them as a
# GitHub release tagged v<version> on the commit the workflow was dispatched from. The version is
# stamped into setup.py, tauri.conf.json and the puffin binary inside the runner's checkout only --
# nothing is committed back, so the tag is the record of the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.3.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (publish it by hand afterwards)"
        type: boolean
        default: true
      run_tests:
        description: "Gate the release on the test suite"
        type: boolean
        default: true
      build_desktop:
        description: "Build the Puffin desktop app (.deb and AppImage)"
        type: boolean
        default: true
      desktop_runner:
        description: "Runner for the desktop build; GB10 is arm64"
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
      build_puffin:
        description: "Build the puffin agent binaries that `puffin update` installs"
        type: boolean
        default: true
      puffin_runner:
        description: "Runner for the puffin build; its architecture names the assets (GB10 is arm64)"
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04

permissions:
  contents: write

# One release at a time; a second dispatch waits rather than racing the first for the tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version format and that the tag is free
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.3.0 or 1.3.0-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

  test:
    needs: validate
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # The pip cache is keyed on a dependency file, and this project declares its
          # dependencies in setup.py, not requirements.txt or pyproject.toml.
          cache-dependency-path: setup.py
      - name: Install
        # `.[dev]` brings the pinned ruff the code-standard ratchet (tests/test_code_quality.py) needs.
        run: pip install -e ".[dev]" pytest
      # No GPU or Docker needed: every hardware and subprocess call in the suite is mocked.
      - name: Test
        run: python -m pytest tests/ -q

  python-dist:
    needs: [validate, test]
    # `test` is skipped when run_tests is off; skipped still counts as clear to proceed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        run: sed -i -E "s/version=\"[^\"]+\"/version=\"$VERSION\"/" setup.py && grep -n 'version=' setup.py
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          # The installer for a machine with no checkout (README, "Install from a release"): it
          # downloads this release's other assets, so it travels with them.
          cp install.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: [validate, test]
    if: ${{ inputs.build_desktop && !failure() && !cancelled() }}
    runs-on: ${{ inputs.desktop_runner }}
    steps:
      - uses: actions/checkout@v4
      # The same packages DesktopInstaller.LINUX_BUILD_PACKAGES installs locally; 4.1 is Tauri v2.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            build-essential pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      # desktop/dist is gitignored, but the bundler insists on a frontend directory to copy even
      # though every window loads the local Onyx server. This is the same placeholder a local
      # checkout carries.
      - name: Placeholder frontend
        run: |
          mkdir -p desktop/dist
          cat > desktop/dist/index.html <<'EOF'
          <!-- Placeholder only. Every window in tauri.conf.json loads the local Onyx server directly, but
               the bundler still wants a frontend directory to copy. -->
          <meta charset="utf-8">
          <title>Puffin</title>
          <p>Puffin is served from http://localhost:3000.</p>
          EOF
      - name: Build bundles
        working-directory: desktop
        run: tauri build --config "{\"version\":\"$VERSION\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  puffin:
    needs: [validate, test]
    if: ${{ inputs.build_puffin && !failure() && !cancelled() }}
    runs-on: ${{ inputs.puffin_runner }}
    env:
      # Compiled into the launcher, so `puffin update` can tell whether a newer release exists.
      PUFFIN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Only the pinned Codex fork; the fano submodule plays no part in the build.
      - name: Codex submodule
        run: git submodule update --init --depth 1 codex
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install puffin-admin
        run: pip install -e .
      # Only the registry is cached: Codex's target directory runs to many gigabytes, past what the
      # Actions cache holds. rustup fetches the toolchain codex-rs/rust-toolchain.toml pins.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'codex-patches/**', 'puffin-rs/**', 'puffin-web-rs/Cargo.lock', 'puffin-code-rs/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.arch }}-
      # The same build `puffin-admin codex build` runs locally: export the submodule, add
      # puffin-rs/, apply codex-patches/, cargo build with prebuilt V8 fetched and verified; then
      # the web commands from puffin-web-rs/ and the code index router from puffin-code-rs/, each a
      # separate --locked build.
      - name: Build puffin
        run: puffin-admin codex build --force
      # Their own tests run the two binaries against a local stand-in for SearXNG and for web
      # pages; the build above has installed the toolchain they need.
      - name: Test the web commands
        working-directory: puffin-web-rs
        run: ~/.cargo/bin/cargo test --release --locked
      - name: Package
        run: |
          bin="$(dirname "$(python -c 'from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; print(B.executable_path())')")"
          target="$(uname -m)-unknown-linux-gnu"
          mkdir -p dist
          gzip -9 -c "$bin/puffin" > "dist/puffin-$target.gz"
          gzip -9 -c "$bin/codex-code-mode-host" > "dist/codex-code-mode-host-$target.gz"
          gzip -9 -c "$bin/puffin-search" > "dist/puffin-search-$target.gz"
          gzip -9 -c "$bin/puffin-fetch" > "dist/puffin-fetch-$target.gz"
          # The router only: `puffin-admin code setup` fetches the indexers it runs.
          gzip -9 -c "$bin/puffin-code" > "dist/puffin-code-$target.gz"
          # `puffin update` checks every archive against this file before installing any.
          (cd dist && sha256sum "puffin-$target.gz" "codex-code-mode-host-$target.gz" \
            "puffin-search-$target.gz" "puffin-fetch-$target.gz" "puffin-code-$target.gz" \
            > "puffin-$target.sha256sums")
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: puffin-binaries
          path: dist/*
          if-no-files-found: error

  release:
    needs: [python-dist, desktop, puffin]
    # `desktop` and `puffin` are skipped when their inputs are off; the release still goes out
    # without them.
    if: ${{ !failure() && !cancelled() && needs.python-dist.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --target "$GITHUB_SHA" --title "Puffin $TAG")
          [[ "${{ inputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          [[ "${{ inputs.draft }}" == "true" ]] && flags+=(--draft)
          # merge-multiple keeps each artifact's own subdirectories (deb/, appimage/), so collect the
          # files themselves; handing gh a directory fails the upload after the release is created.
          mapfile -t files < <(find artifacts -type f | sort)
          printf 'Uploading %s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
