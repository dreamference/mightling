name: CLA

# Every pull request author must sign CLA.md once; signatures are recorded on the `cla-signatures`
# branch of this repository. Dreamference's own account is exempt.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, with its tag in a comment: this job runs for every outside pull request
      # with a token that can write to the repository, so a moved tag must not change what runs.
      - name: Check the contributor agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/dreamference/mightling/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dgxcoder,dependabot[bot],github-actions[bot]
