# Builds Puffin's client for the machines that are not a GB10: Intel/AMD Linux and macOS (Apple
# silicon and Intel). A client is `puffin` and its commands, talking to a model server on a GB10
# node; nothing here builds or runs a model server.
#
# Runs on pushes to clients/** branches (CI), by hand, and from release.yml (`build_clients`),
# which passes the version that `puffin update` compares against. The assets are named as
# install.sh and `puffin update` expect: <name>-<target>.gz and puffin-<target>.sha256sums
# (scripts/package_puffin.sh).
name: Build clients

on:
  push:
    branches: ["clients/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version compiled into puffin; empty for a source build"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Only the pinned upstream fork; nothing else is a submodule.
      - name: Codex submodule
        run: git submodule update --init --depth 1 codex
      # Compiled into the launcher, so `puffin update` can tell whether a newer release exists. Left
      # unset on a CI build: an empty value would read as a version.
      - name: Version
        if: ${{ inputs.version != '' }}
        run: echo "PUFFIN_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
      # The Codex build's target directory runs to many gigabytes; the hosted Linux image ships
      # toolchains this build never uses.
      - name: Disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The builder alone: building a client needs none of the node's Python dependencies (the
      # model tooling, PyTorch), only what the builder module imports.
      - name: Builder
        run: |
          pip install --no-deps -e .
          pip install rich requests toml pyyaml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.target }}-${{ hashFiles('.gitmodules', 'codex-patches/**', 'puffin-rs/**', 'puffin-web-rs/Cargo.lock', 'puffin-code-rs/Cargo.lock') }}
          restore-keys: cargo-registry-${{ matrix.target }}-
      # The same build `puffin-admin codex build` runs: export the submodule, add puffin-rs/, apply
      # codex-patches/, cargo build with the prebuilt V8 for this target fetched and verified against
      # the submodule's manifest; then the web commands and the code index router, each --locked.
      - name: Build puffin
        run: |
          python - <<'EOF'
          import sys
          from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B
          print("target:", B.host_target())
          sys.exit(0 if B.build(force=True) else 1)
          EOF
          df -h . || true
      - name: Bin directory
        run: |
          bin="$(dirname "$(python -c 'from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; print(B.executable_path())')")"
          echo "PUFFIN_BIN=$bin" >> "$GITHUB_ENV"
          ls -l "$bin"
      - name: Test the web commands
        working-directory: puffin-web-rs
        run: ~/.cargo/bin/cargo test --release --locked
      - name: Smoke test
        run: |
          "$PUFFIN_BIN/puffin" --version
          "$PUFFIN_BIN/puffin" --help | head -5
          "$PUFFIN_BIN/puffin-search" --help | head -3
          "$PUFFIN_BIN/puffin-fetch" --help | head -3
          "$PUFFIN_BIN/puffin-code" --help | head -3
          file "$PUFFIN_BIN/puffin"
      # /airgapped on reaches macOS commands only through Seatbelt, which Codex configures from
      # sandbox_workspace_write.network_access when puffin starts (puffin-rs/src/airgapped.rs). This
      # checks that rule on the real thing: the same command, with and without network.
      - name: Seatbelt takes the network away
        if: runner.os == 'macOS'
        run: |
          sandbox() {
            "$PUFFIN_BIN/puffin" sandbox -c 'sandbox_mode="workspace-write"' \
              -c "sandbox_workspace_write.network_access=$1" -- \
              curl -sS -m 20 -o /dev/null -w '%{http_code}\n' https://example.com
          }
          echo "network_access=true:"
          sandbox true
          echo "network_access=false (must fail):"
          if sandbox false; then
            echo "::error::a sandboxed command reached the network with network_access=false"
            exit 1
          fi
          echo "blocked, as it must be"
      - name: Package
        run: scripts/package_puffin.sh "${{ matrix.target }}" "$PUFFIN_BIN" dist
      - uses: actions/upload-artifact@v4
        with:
          name: puffin-client-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
