# Builds Mightling's client for the machines that are not a GB10: Intel/AMD Linux and macOS (Apple
# silicon and Intel). A client is `ling` and its commands, talking to a model server on a GB10
# node; nothing here builds or runs a model server.
#
# Runs on pushes to clients/** branches (CI), by hand, and from release.yml (`build_clients`),
# which passes the version that `ling update` compares against. The assets are named as
# install.sh and `ling update` expect: <name>-<target>.gz and ling-<target>.sha256sums
# (scripts/package_mightling.sh).
#
# On macOS, when a release asks for it (`sign`) and the Apple secrets are in the `release`
# environment, the binaries are signed with the Developer ID and the hardened runtime and notarised
# before they are packaged, so the archives and their sums are of the signed files
# (docs/dev/macos-signing.md). Without the secrets nothing changes.
#
# Where the Apple silicon build runs: the self-hosted Mac mini the repository variable MACOS_RUNNER
# names (a JSON runs-on value), else GitHub's macos-15. The `macos_runner` input `github` forces
# GitHub's runner for one run; deleting the variable does it for every run (the Mac is offline: a
# job waiting for it would queue for a day). The Intel build stays on GitHub's macos-15-intel, since
# the job runs what it builds. The self-hosted runner must never be reachable from a pull request
# (this repository is public): this workflow has no pull_request trigger, its callers have none,
# and the runner's own job-started hook refuses every event but push, workflow_dispatch and
# schedule. Never add pull_request or pull_request_target here or in release-build.yml.
name: Build clients

on:
  push:
    branches: ["clients/**"]
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "Runner for the Apple silicon build: mac (the MACOS_RUNNER variable's, if set) or github"
        type: choice
        default: mac
        options:
          - mac
          - github
  workflow_call:
    inputs:
      macos_runner:
        description: "mac (the MACOS_RUNNER variable's runner, if set) or github (macos-15)"
        type: string
        default: mac
      version:
        description: "Release version compiled into ling; empty for a source build"
        type: string
        default: ""
      sign:
        description: "Sign and notarise the macOS binaries with the Developer ID when the release environment has the Apple secrets"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: '"ubuntu-24.04"'
          # JSON for runs-on: the self-hosted Mac's labels from MACOS_RUNNER, or macos-15.
          - target: aarch64-apple-darwin
            runner: ${{ (inputs.macos_runner != 'github' && !startsWith(github.event_name, 'pull_request') && vars.MACOS_RUNNER) || '"macos-15"' }}
          - target: x86_64-apple-darwin
            runner: '"macos-15-intel"'
    runs-on: ${{ fromJSON(matrix.runner) }}
    # The Apple secrets live only in the release environment (main and release/* only); asked for
    # only when signing is, so a push to clients/** runs as before.
    environment: ${{ inputs.sign && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Only the pinned upstream fork; the ling-engine submodule (a spec) plays no part in the build.
      - name: Codex submodule
        run: git submodule update --init --depth 1 codex
      # Compiled into the launcher, so `ling update` can tell whether a newer release exists. Left
      # unset on a CI build: an empty value would read as a version.
      - name: Version
        if: ${{ inputs.version != '' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "MIGHTLING_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
      # The Codex build's target directory runs to many gigabytes; the hosted Linux image ships
      # toolchains this build never uses.
      - name: Disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The builder alone: building a client needs none of the node's Python dependencies (the
      # model tooling, PyTorch), only what the builder module imports.
      - name: Builder
        run: |
          pip install --no-deps -e .
          pip install rich requests toml pyyaml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.target }}-${{ hashFiles('.gitmodules', 'codex-patches/**', 'ling-rs/**', 'ling-web-rs/Cargo.lock', 'ling-code-rs/Cargo.lock', 'ling-docs-rs/Cargo.lock') }}
          restore-keys: cargo-registry-${{ matrix.target }}-
      # `ling web` serves the Mightling UI from inside the binary: the build runs desktop/ui's
      # Vite build first and embeds it (LING_WEB_UI_DIST, ling-rs/web/build.rs).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # The same build `ling-admin codex build` runs: export the submodule, add ling-rs/, apply
      # codex-patches/, cargo build with the prebuilt V8 for this target fetched and verified against
      # the submodule's manifest; then the web commands and the code index router, each --locked.
      - name: Build ling
        run: |
          python - <<'EOF'
          import sys
          from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B
          print("target:", B.host_target())
          sys.exit(0 if B.build(force=True) else 1)
          EOF
          df -h . || true
      - name: Bin directory
        run: |
          bin="$(dirname "$(python -c 'from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; print(B.executable_path())')")"
          echo "MIGHTLING_BIN=$bin" >> "$GITHUB_ENV"
          ls -l "$bin"
      # Signed or not (scripts/macos/signing_gate.sh): macOS, signing asked for, and all six Apple
      # secrets set. Before the tests below, so they run the signed, hardened binaries.
      - name: Apple signing
        id: apple
        if: runner.os == 'macOS'
        env:
          SIGN: ${{ inputs.sign }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: scripts/macos/signing_gate.sh
      - name: Import the Developer ID
        if: ${{ steps.apple.outputs.sign == 'true' }}
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/macos/import_identity.sh
      - name: Sign the binaries with the Developer ID
        if: ${{ steps.apple.outputs.sign == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/macos/sign_binaries.sh "$MIGHTLING_BIN"
          # The host starts under the hardened runtime (its V8 starts only with a cell to run).
          "$MIGHTLING_BIN/codex-code-mode-host" --help | head -3
      - name: Test the web commands
        working-directory: ling-web-rs
        # rustup's shims sit in ~/.cargo/bin when the build installed it, elsewhere when the
        # runner image ships it (macos-15-arm64 since the 2026-10-28 image).
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --release --locked
      - name: Smoke test
        run: |
          "$MIGHTLING_BIN/ling" --version
          "$MIGHTLING_BIN/ling" --help | head -5
          "$MIGHTLING_BIN/ling-search" --help | head -3
          "$MIGHTLING_BIN/ling-fetch" --help | head -3
          "$MIGHTLING_BIN/ling-code" --help | head -3
          file "$MIGHTLING_BIN/ling"
      # /airgapped on reaches macOS commands only through Seatbelt, which Codex configures from
      # sandbox_workspace_write.network_access when ling starts (ling-rs/src/airgapped.rs). This
      # checks that rule on the real thing: the same command, with and without network.
      - name: Seatbelt takes the network away
        if: runner.os == 'macOS'
        run: |
          sandbox() {
            "$MIGHTLING_BIN/ling" sandbox -c 'sandbox_mode="workspace-write"' \
              -c "sandbox_workspace_write.network_access=$1" -- \
              curl -sS -m 20 -o /dev/null -w '%{http_code}\n' https://example.com
          }
          echo "network_access=true:"
          sandbox true
          echo "network_access=false (must fail):"
          if sandbox false; then
            echo "::error::a sandboxed command reached the network with network_access=false"
            exit 1
          fi
          echo "blocked, as it must be"
      # Apple's notary knows each binary from here on, so Gatekeeper accepts one that arrives with a
      # quarantine mark (downloaded by a browser). A bare binary cannot carry a stapled ticket; the
      # check is online. Notarising does not change the files.
      - name: Notarise the binaries
        if: ${{ steps.apple.outputs.sign == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          staging="$RUNNER_TEMP/mightling-client-${{ matrix.target }}"
          mkdir -p "$staging"
          for name in ling codex-code-mode-host ling-search ling-fetch ling-code ling-docs ling-signal; do
            if [[ -f "$MIGHTLING_BIN/$name" ]]; then cp -p "$MIGHTLING_BIN/$name" "$staging/"; fi
          done
          ditto -c -k --keepParent "$staging" "$staging.zip"
          scripts/macos/notarize.sh "$staging.zip"
          rm -rf "$staging" "$staging.zip"
      - name: Package
        run: scripts/package_mightling.sh "${{ matrix.target }}" "$MIGHTLING_BIN" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mightling-client-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Remove the Developer ID
        if: ${{ always() && steps.apple.outputs.sign == 'true' }}
        run: scripts/macos/remove_identity.sh
