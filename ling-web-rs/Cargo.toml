[package]
name = "ling-web"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ling_web"
path = "src/lib.rs"

[[bin]]
name = "ling-search"
path = "src/bin/ling-search.rs"

[[bin]]
name = "ling-fetch"
path = "src/bin/ling-fetch.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ego-tree = "0.11"
encoding_rs = "0.8.42"
regex = "1.13.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2", features = ["cookies"] }

# Small, quick to start and nothing to debug in the field: these run once per model tool call.
[profile.release]
strip = true
lto = "thin"
