# Presents MCP tools to the local model server as plain function tools (patch 0020). Its own
# crate, with serde_json as its only dependency, because Codex's core calls it and the launcher
# crate depends on crates that depend on core.
[package]
name = "mling-tools"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "mling_tools"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true, features = ["raw_value"] }
