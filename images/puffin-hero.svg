<svg viewBox="0 0 820 326" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" role="img" aria-label="Installing Puffin, starting it, and an egress audit that passes with every connection on 127.0.0.1">
  <defs>
    <linearGradient id="bar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2A313C"/>
      <stop offset="1" stop-color="#232A33"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="820" height="326" rx="14" fill="#141B26"/>
  <rect x="0" y="0" width="820" height="38" rx="14" fill="url(#bar)"/>
  <rect x="0" y="24" width="820" height="14" fill="#232A33"/>
  <circle cx="24" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="64" cy="19" r="6" fill="#28C840"/>
  <text x="410" y="24" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#8B95A5">your GB10 · no cloud · no account</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15">
    <text x="24" y="74"><tspan fill="#FF7A47">$</tspan><tspan fill="#F4F7FB"> curl -fsSL …/puffin/releases/latest/download/install.sh | bash</tspan></text>
    <text x="24" y="106"><tspan fill="#FF7A47">$</tspan><tspan fill="#F4F7FB"> puffin-admin server start</tspan><tspan fill="#5C6878">        # the model, on your machine</tspan></text>
    <text x="24" y="138"><tspan fill="#FF7A47">$</tspan><tspan fill="#F4F7FB"> cd ~/your-project &amp;&amp; puffin "fix the flaky login test"</tspan></text>
    <text x="24" y="182"><tspan fill="#FF7A47">$</tspan><tspan fill="#F4F7FB"> puffin-admin audit egress</tspan><tspan fill="#5C6878">        # what left the machine?</tspan></text>
    <text x="24" y="206" fill="#4ADE80">✅ Egress audit: pass</text>
    <text x="24" y="230" fill="#C9D1DC">Network destinations:</text>
    <text x="24" y="254" fill="#C9D1DC">   127.0.0.1:8000             29x  model server</text>
    <text x="24" y="278" fill="#C9D1DC">   127.0.0.1:8767              1x  Gmail search service</text>
    <text x="24" y="302" fill="#4ADE80">DNS queries: none</text>
  </g>
</svg>
