# The NF4 QLoRA arm: the same adapter trained on bitsandbytes NF4 of the BF16 original.
# docs/dev/adapter-pipeline-2026-10-19.md explains each choice.
name = "rust-r16-48k-nf4"

[lora]
rank = 16
alpha = 32          # alpha = 2 x rank
dropout = 0.0

[train]
base = "nf4"                    # A/B arm: bitsandbytes NF4 QLoRA of the original BF16 checkpoint
original = "Qwen/Qwen3.8-27B"     # revision e13a4f0e, the source of the served conversion
# snapshot = "~/.cache/huggingface/hub/models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/<rev>/"
samples = "~/.local/share/dreamference/adapters/rust/samples-v1.jsonl"
output_dir = "~/.local/share/dreamference/adapters/rust/rust-r16-48k-nf4"
max_seq_len = 51200             # the nights' 49,152-token task_context caps the prompt; + room for the last completion
epochs = 2
grad_accum = 16                 # trajectories per optimizer step
learning_rate = 1.0e-4
min_lr_share = 0.1
warmup_share = 0.03
weight_decay = 0.0
max_grad_norm = 1.0
loss_chunk = 2048               # tokens per cross-entropy chunk (2048 x 248320 fp32 = 2 GB)
validation_share = 0.05
eval_every = 25
save_every = 50
seed = 20261019
psi_full_avg10_limit = 20.0

[estimate]
# Used by `plan` until the samples exist: 800 accepted segments (200 at each of the night runs'
# measured quartiles (19K / 28K / 38K / 45K tokens)), and the GB10 throughput range to measure first.
assumed_samples = 200
assumed_lengths = [19360, 28486, 38429, 44619]
effective_tflops = [30, 45, 60]
