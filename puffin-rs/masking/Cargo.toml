# Observation masking (specs/DREAMFERENCE_PUFFIN_CONTEXT_BUDGET.md §4.1): the output of old tool
# calls is replaced in what is sent to the model by a short placeholder naming a saved copy. Its
# own crate, with serde as its only dependency, because Codex's core calls it (patch 0021) and the
# launcher crate depends on crates that depend on core.
[package]
name = "puffin-masking"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "puffin_masking"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
