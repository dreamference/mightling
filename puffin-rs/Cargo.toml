# The Puffin launcher: what used to be Dreamference's Python `puffin` entry point, compiled into the
# branded Codex binary. It is not part of the codex submodule. CodexBrandedBuilder copies this crate
# into the exported tree as `codex-rs/puffin`; patch 0002 adds one dependency line to the CLI's
# manifest (a path dependency inside the workspace root makes it a member automatically) and one
# call in `cli_main`. It builds against the workspace's own dependency versions.
[package]
name = "puffin-launcher"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"

[lib]
name = "puffin_launcher"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
codex-extension-api = { workspace = true }
codex-models-manager = { workspace = true }
codex-utils-home-dir = { workspace = true }
flate2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
semver = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["time"] }
toml = { workspace = true }
toml_edit = { workspace = true }

# Build OpenSSL from source on glibc Linux, as upstream does only for musl, so building puffin needs
# no libssl-dev. Cargo unifies features across the build, so enabling `vendored` here applies to the
# openssl-sys every other crate links -- which is what keeps this out of a patch to codex-core.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt"] }
