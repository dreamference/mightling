# puffin-code: the code index router (specs/DREAMFERENCE_PUFFIN_CODE_INDEX.md). A program of its own
# beside puffin, puffin-admin and puffin-search, deliberately outside the Codex workspace: it has its
# own lockfile, builds with `cargo build --release --locked` here, and changing it never rebuilds
# Codex (spec §4.2).
[package]
name = "puffin-code"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "puffin_code"
path = "src/lib.rs"

[[bin]]
name = "puffin-code"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "debuginfo"
