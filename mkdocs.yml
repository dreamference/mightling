site_name: Mightling
site_description: A private AI assistant and coding agent that runs entirely on your NVIDIA GB10.
copyright: Mightling by Dreamference · licensed AGPL-3.0-or-later.

theme:
  name: material
  logo: assets/ling.svg
  favicon: assets/ling.svg
  # System fonts: a privacy-first product should not send every visitor to a font CDN.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Use Mightling:
      - Terminal agent: ling.md
      - Web chat: web-chat.md
      - Desktop app: desktop.md
      - Phone messengers: messengers.md
  - Reference:
      - ling-admin: admin.md
      - Models: models.md
  - How it works:
      - Architecture: architecture.md
      - Privacy & security: privacy.md
      - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
